<svg width="75px"  height="75px"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid" class="lds-ring" style="background: none; animation-play-state: running; animation-delay: 0s;">
    <circle cx="50" cy="50" ng-attr-r="{{config.radius}}" ng-attr-stroke="{{config.base}}" ng-attr-stroke-width="{{config.width}}" fill="none" r="37" stroke="#e3e3e3" stroke-width="8" style="animation-play-state: running; animation-delay: 0s;"></circle>
    <circle cx="50" cy="50" ng-attr-r="{{config.radius}}" ng-attr-stroke="{{config.stroke}}" ng-attr-stroke-width="{{config.innerWidth}}" ng-attr-stroke-linecap="{{config.linecap}}" fill="none" r="37" stroke="#ff9900" stroke-width="8" stroke-linecap="square" transform="rotate(104.97 50 50)" style="animation-play-state: running; animation-delay: 0s;">
      <animateTransform attributeName="transform" type="rotate" calcMode="linear" values="0 50 50;180 50 50;720 50 50" keyTimes="0;0.5;1" dur="1.5s" begin="0s" repeatCount="indefinite" style="animation-play-state: running; animation-delay: 0s;"></animateTransform>
      <animate attributeName="stroke-dasharray" calcMode="linear" values="18.598228509251577 213.8796278563931;92.99114254625788 139.4867138193868;18.598228509251577 213.8796278563931" keyTimes="0;0.5;1" dur="1.5" begin="0s" repeatCount="indefinite" style="animation-play-state: running; animation-delay: 0s;"></animate>
    </circle>
  </svg>